name: Application checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_MODE: demo
      - run: npx playwright install --with-deps chromium
      - name: Browser regression checks
        run: |
          npm start -- --port 3100 > /tmp/postly-server.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://localhost:3100/ > /dev/null && break; sleep 1; done
          npm run test:proxy
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            /tmp/postly-*.png
            /tmp/postly-server.log
